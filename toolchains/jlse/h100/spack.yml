# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - cmake
  - fftw ~mpi
  - ginkgo~openmp+cuda cuda_arch=90
  - googletest
  - ninja
  - paraconf
  - pdi
  - pdiplugin-decl-hdf5
  - pdiplugin-mpi
  - pdiplugin-set-value
  - pdiplugin-trace
  - openblas
  - openmpi+cuda cuda_arch=90
  view: true
  concretizer:
    unify: true
  compilers:
  - compiler:
      spec: gcc@=11.1.0
      paths:
        cc: /soft/compilers/gcc/11.1.0/x86_64-suse-linux/bin/gcc
        cxx: /soft/compilers/gcc/11.1.0/x86_64-suse-linux/bin/g++
        f77: /soft/compilers/gcc/11.1.0/x86_64-suse-linux/bin/gfortran
        fc: /soft/compilers/gcc/11.1.0/x86_64-suse-linux/bin/gfortran
      flags: {}
      operating_system: opensuse15
      target: x86_64
      modules: []
      environment: {}
      extra_rpaths: []
  repos:
  - /home/ac.amillan/source/spack_pdi
  packages:
    cuda:
      externals:
      - spec: cuda@12.3.52
        prefix: /soft/compilers/cuda/cuda-12.3.0
